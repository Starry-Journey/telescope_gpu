[project]
name = "telescope-engineering"
version = "0.2.0"
description = "基于相位差法与高性能计算的大口径望远镜重力变形标定研究——数据链路工程版（GPU/CUDA 反演引擎 + CNN 加速，HPC · AI4S）"
readme = "README.md"
# 说明：本仓库存在三个 Python 基线（CI ubuntu-22.04 自带 3.10、Docker 3.8、
# 打包桌面 py -3.13），暂不设 requires-python 硬约束；已验证版本组合见
# constraints.txt，升级依赖后请在三个环境各跑一遍测试。
# PySide6 的平台约束（重要）：
#   * 6.10+ 的 Linux wheel 要求 glibc >= 2.34（Ubuntu 22.04+）；
#   * 本机已迁到 Ubuntu 24.04（glibc 2.39），可装 6.12；
#   * Linux 分支暂留 6.9.3 以兼容 20.04/旧环境，需要时再升 6.12；
#   * Windows 打包仍用 6.12（requirements-desktop.txt / constraints.txt）。
dependencies = [
    "PySide6==6.12.0; sys_platform == 'win32'",
    "PySide6==6.9.3; sys_platform != 'win32'",
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5",
    "matplotlib>=3.7",
    "nlopt>=2.7",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]
# CPU/GPU 训练与可微前向（CUDA 版 torch 的索引见 scripts/setup_wsl_dev.sh）
ml = ["torch>=2.0"]
# Linux/HPC 运行期可选能力：HDF5 数据、MPI 并行
hpc = ["h5py>=3.10", "mpi4py>=4.0"]
# 本仓库的开发工具链：C++ pybind11 绑定、lint、测试
dev = ["ruff>=0.6", "pytest>=8", "pybind11>=2.11"]

# 本仓库不是一个可安装的单一 Python 包（products/desktop/pipeline/ml 都是
# 顶层目录），uv 只负责按 pyproject 建环境，不执行 `pip install .`。
[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["archive", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
