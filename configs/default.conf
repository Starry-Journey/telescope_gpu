# telescope_gpu 默认配置
# 格式：key = value；# 之后为注释。命令行 --key value 可覆盖任意一项。

# ---- 光学系统 ----
img_size      = 256       # 探测器像素
oversample    = 2         # 过采样；img_size * oversample 必须是 2 的幂
pupil_radius  = 0.45      # 归一化光瞳半径 (0, 1]

# ---- 观测 ----
theta_deg     = 45        # 望远镜俯仰角（度）
defocus       = 0, 1, -1, 2, -2   # 相位差帧，单位：波长

# ---- 星场与噪声 ----
star_count    = 15
flux_min      = 3000
flux_max      = 15000
seed          = 42
background    = 200
read_noise    = 5
# header: 用 FITS 头部 BKG（仿真真值）；median: 用每帧中位数
background_mode = header

# ---- 反演 ----
solve_starts  = 40        # 多起点粗搜（对称搜索区间下 20 个容易漏掉真解盆地）
solve_refine  = 3         # BOBYQA 精修前 N 名
solve_seed    = 12345
solve_maxeval = 2000

# ---- 输入输出 ----
# data_dir 留空时自动使用 theta_%03ddeg
data_dir      =
result_file   = inverse_result.txt
report_file   = inverse_report.txt
